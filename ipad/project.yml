name: PlanetSongTeacher
options:
  bundleIdPrefix: za.lerouxstudio
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: W65625G5HH
    CODE_SIGN_STYLE: Automatic
targets:
  PlanetSongTeacher:
    type: application
    platform: iOS
    sources:
      - PlanetSongTeacher
      # the teacher screens and the shared code (copied here as a folder by install-on-ipad.sh)
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: PlanetSongTeacher/Info.plist
      properties:
        CFBundleDisplayName: Planet Songs
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchNight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIBackgroundModes: [audio]
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: za.lerouxstudio.planetsongteacher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
