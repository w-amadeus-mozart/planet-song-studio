<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Planet Song Teacher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: mission control. Top bar with class switcher; left = the class's eight planets as live cards,
   right = the live feed. Songs and Suno are their own tabs. Single dark theme on purpose (the board is projected). */
:root{
  --bg:#10143a; --bg2:#080b24; --surface:#1b2156; --surface2:#262d6c; --line:#36408a;
  --ink:#f4f3ff; --muted:#aab0dc; --accent:#ffb547; --accent2:#ff6f91; --ok:#5fe0a8; --rec:#ff4d5e;
  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,sans-serif;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg2);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 85% -10%,#2b3290 0%,transparent 55%),radial-gradient(1.5px 1.5px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 60%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 85%,#fff7 50%,transparent 51%),var(--bg2);background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
.muted{color:var(--muted)} .small{font-size:14px}
.label{font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);font-weight:900;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1200}
.btn.sm{min-height:38px;padding:5px 13px;font-size:14px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:color-mix(in srgb,var(--surface) 92%,transparent);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.orb{position:relative;display:inline-block;width:var(--s,40px);aspect-ratio:1;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 30%,var(--c1),var(--c2) 72%);box-shadow:inset calc(var(--s) * -.12) calc(var(--s) * -.1) calc(var(--s) * .2) #0006}
.orb.ring::after{content:"";position:absolute;left:-32%;right:-32%;top:38%;bottom:38%;border:calc(var(--s) * .05) solid #f3dfa9cc;border-radius:50%;transform:rotate(-18deg)}
.orb.side::after{transform:rotate(80deg);border-color:#c9f5f377;border-width:calc(var(--s) * .03)}
textarea,input[type=text],input[type=email],input[type=password]{width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px;resize:vertical}

.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.top h1{font-size:26px;color:var(--accent)}
.classes{display:flex;gap:6px;padding:4px;border-radius:16px;background:var(--bg2);border:2px solid var(--line)}
.classes button{min-width:72px;min-height:46px;border-radius:12px;border:0;background:transparent;font-family:var(--display);font-size:22px;color:var(--muted)}
.classes button[aria-pressed=true]{background:var(--accent);color:#1b1200}
.tabs{display:flex;gap:6px}
.tab{min-height:46px;padding:6px 16px;border-radius:12px;border:2px solid transparent;background:transparent;font-weight:900;color:var(--muted)}
.tab[aria-selected=true]{border-color:var(--accent);background:var(--surface);color:var(--ink)}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--muted);margin-left:auto}
.conn i{width:10px;height:10px;border-radius:50%;background:var(--rec)}
.conn.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
main{padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}

.live{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.planet{position:relative;overflow:hidden;border-radius:var(--r);border:2px solid color-mix(in srgb,var(--pc) 60%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 34%,var(--surface)),var(--surface) 70%);padding:14px;min-height:190px;display:flex;flex-direction:column;gap:8px}
.planet.flash{animation:flash 1.6s}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}30%{box-shadow:0 0 0 6px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.planet .ph{display:flex;align-items:center;gap:10px}
.planet h3{font-size:22px;flex:1}
.team{border-top:2px dashed #ffffff22;padding-top:8px;display:flex;flex-direction:column;gap:4px}
.team b{font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:3px 10px;border-radius:999px;background:#0005;font-weight:800;font-size:13px}
.tag.genre{background:var(--accent);color:#1b1200}
.tag.song{background:var(--ok);color:#00261a}
.empty{color:var(--muted);font-size:14px;margin:auto 0}
.feed{max-height:calc(100vh - 120px);overflow:auto;display:flex;flex-direction:column;gap:8px;position:sticky;top:90px}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--bg2);border:2px solid var(--line)}
.ev.dim{opacity:.55}
.ev .when{font-size:12px;color:var(--muted);white-space:nowrap}
.banner{position:fixed;top:calc(84px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;background:var(--accent);color:#1b1200;font-weight:900;font-size:18px;box-shadow:0 12px 32px #000a;max-width:92vw}

.songs{display:flex;flex-direction:column;gap:12px}
.song{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.song audio{width:100%}
.song .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
details summary{cursor:pointer;font-weight:800;min-height:36px;display:flex;align-items:center}
.lyrics{white-space:pre-wrap;font-size:15px;background:var(--bg2);border-radius:12px;padding:12px;margin-top:6px}

.suno{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.field .lab{display:flex;align-items:center;justify-content:space-between}
.progress{height:14px;border-radius:99px;background:var(--bg2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent)}

.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ph{display:flex;align-items:center;gap:12px}
.ph h2{font-size:26px}
.gate{max-width:440px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px;padding:24px}
.gate h1{font-size:34px;color:var(--accent)}
.trow{display:flex;align-items:center;gap:8px;justify-content:space-between}
.codechip{border:2px solid var(--accent);background:#0006;color:var(--accent);border-radius:10px;padding:3px 9px;font-weight:900;font-size:14px;letter-spacing:.06em;min-height:34px}
.addteam{margin-top:auto;align-self:flex-start}
.sheet-bg{position:fixed;inset:0;z-index:50;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--surface)}
.bigcode{font-family:var(--display);font-size:clamp(48px,9vw,76px);letter-spacing:.18em;text-align:center;color:var(--accent);padding:8px 0}
.crow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:2px dashed #ffffff22}
.crow b{font-family:var(--display);font-weight:400;font-size:22px;min-width:60px}
.qr{position:fixed;inset:0;z-index:60;background:#fff;color:#10143a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center}
.qr h2{font-size:clamp(32px,5vw,60px)}
.qr .code{line-height:0}
.qr .code img{width:min(62vh,80vw);height:auto;image-rendering:pixelated}
.qr .cls{font-family:var(--display);font-size:clamp(40px,7vw,90px);color:#ff7a2f}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ok);color:#00261a;font-weight:900;padding:12px 22px;border-radius:999px;z-index:90}
@media (max-width:1000px){ .live{grid-template-columns:minmax(0,1fr)} .feed{position:static;max-height:none} .board{grid-template-columns:repeat(2,minmax(0,1fr))} .song{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>
<div id="app"></div>
<script src="../shared/qrcode.js"></script>
<script type="module" src="teacher.js"></script>
</body>
</html>
